<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPOP流行報 第43期 - 10/18 - 10/24</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-hover: #252540;
            --text: #e8e8f0;
            --text-muted: #a0a0b8;
            --accent: #ff2a6d;
            --accent2: #05d9e8;
            --gold: #ffd700;
            --border: #2a2a45;
            --gradient-start: #ff2a6d;
            --gradient-end: #05d9e8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }
        .newspaper {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg);
            min-height: 100vh;
        }
        /* ── 封面 ── */
        .cover-banner {
            width: 100%;
            border-radius: 0 0 16px 16px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(255,42,109,0.15);
        }
        .cover-banner img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* ── 報頭 ── */
        .masthead {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            border-bottom: 3px solid var(--accent);
        }
        .tagline {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .title {
            font-family: 'Noto Serif TC', serif;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
        }
        .issue-info {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        /* ── 內容區 ── */
        .content { padding: 2rem; }
        .section { margin-bottom: 3rem; }
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--accent);
        }
        .section-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.6rem;
            font-weight: 900;
            flex: 1;
            color: var(--text);
        }
        .section-icon {
            font-size: 1.5rem;
        }
        /* ── 焦點卡片 ── */
        .highlight-card {
            background: linear-gradient(135deg, var(--bg-card), #252540);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .highlight-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }
        .highlight-badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .highlight-song {
            font-size: 2rem;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }
        .highlight-artist {
            font-size: 1.2rem;
            color: var(--text-muted);
        }
        /* ── 排行榜表格 ── */
        .chart-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .chart-table thead {
            background: var(--bg-card);
        }
        .chart-table th {
            padding: 0.75rem 0.5rem;
            text-align: left;
            color: var(--accent2);
            font-weight: 700;
            border-bottom: 2px solid var(--accent);
        }
        .chart-table td {
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .rank-cell {
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--accent);
            width: 50px;
            text-align: center;
        }
        .song-cell { min-width: 200px; }
        .song-title { font-weight: 700; color: var(--text); }
        .song-artist { font-size: 0.85rem; color: var(--text-muted); }
        .trend-cell { width: 60px; text-align: center; }
        .trend-up { color: #4ade80; }
        .trend-down { color: #f87171; }
        .trend-same { color: var(--text-muted); }
        .weeks-cell { width: 60px; text-align: center; color: var(--text-muted); }
        .links-cell { width: 150px; }
        .links-cell a {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            text-decoration: none;
            margin-right: 0.3rem;
            margin-bottom: 0.2rem;
        }
        .link-yt { background: #ff0000; color: white; }
        .link-sp { background: #1db954; color: white; }
        /* ── 新聞卡片 ── */
        .news-grid {
            display: grid;
            gap: 1rem;
        }
        .news-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            transition: background 0.2s;
        }
        .news-card:hover { background: var(--bg-hover); }
        .news-thumb {
            width: 100px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .news-content { flex: 1; }
        .news-meta {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
        }
        .news-source-tag {
            background: rgba(255,42,109,0.2);
            color: var(--accent);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
        }
        .news-date { color: var(--text-muted); }
        .news-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        .news-title a {
            color: var(--text);
            text-decoration: none;
        }
        .news-title a:hover { color: var(--accent2); }
        .news-summary {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
        /* ── 新曲卡片 ── */
        .releases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .release-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }
        .release-card:hover { transform: translateY(-4px); }
        .release-thumb {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .release-info { padding: 1rem; }
        .release-title {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.3rem;
            font-size: 0.95rem;
        }
        .release-artist {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }
        .release-date {
            font-size: 0.8rem;
            color: var(--accent2);
        }
        /* ── 演唱會卡片 ── */
        .concerts-grid {
            display: grid;
            gap: 1rem;
        }
        .concert-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .concert-date {
            background: linear-gradient(135deg, var(--accent), #ff6b9d);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            min-width: 80px;
        }
        .concert-info { flex: 1; }
        .concert-title {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.3rem;
        }
        .concert-artist {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .concert-venue {
            font-size: 0.85rem;
            color: var(--accent2);
            margin-top: 0.2rem;
        }
        /* ── 空訊息 ── */
        .empty-msg {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: 12px;
        }
        /* ── 頁尾 ── */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }
        /* ── 響應式 ── */
        @media (max-width: 600px) {
            .content { padding: 1rem; }
            .title { font-size: 2rem; }
            .news-card { flex-direction: column; }
            .news-thumb { width: 100%; height: 150px; }
            .releases-grid { grid-template-columns: 1fr; }
            .chart-table { font-size: 0.85rem; }
            .links-cell { display: none; }
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <!-- 封面 -->
        <div class="cover-banner">
            <img src="images/cover-3.png" alt="JPOP流行報封面">
        </div>

        <!-- 報頭 -->
        <div class="masthead">

            <div class="section">

            <div class="section">

        <div class="footer">
            <p>JPOP流行報 第43期 | 自動生成於 2026-10-23 12:01</p>

        </div>
    </div>
</body>
</html>
