<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JPOP流行報 - 2026年6月7日 第23期</title><style>:root{ --accent:#ff2a6d; --bg:#0f0f1a; --card:#1a1a2e; --text:#e0e0e0; --muted:#a0a0b0; }*{ box-sizing:border-box; }body{ margin:0; font-family: "Noto Sans TC", "Hiragino Sans", "Meiryo", sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }a{ color:#4fc3f7; text-decoration:none; }a:hover{ text-decoration:underline; }.container{ max-width:960px; margin:0 auto; padding:20px; }header{ text-align:center; padding:30px 0; border-bottom:3px solid var(--accent); margin-bottom:30px; }header h1{ font-size:2.8rem; margin:0; color:var(--accent); letter-spacing:4px; text-shadow:0 0 10px rgba(255,42,109,0.4); }header .date{ color:var(--muted); font-size:1rem; margin-top:8px; }.cover{ width:100%; border-radius:12px; margin-bottom:30px; box-shadow:0 10px 30px rgba(0,0,0,0.5); }section{ margin-bottom:40px; }h2{ font-size:1.6rem; border-left:6px solid var(--accent); padding-left:14px; margin:30px 0 18px; color:#fff; }.highlight{ background:linear-gradient(135deg, #1a1a2e 0%, #2a0f1a 100%); border:1px solid #331122; border-radius:14px; padding:24px; }.highlight h3{ margin-top:0; color:var(--accent); font-size:1.4rem; }.highlight p{ color:var(--text); }.links{ margin-top:12px; }.links a{ display:inline-block; margin-right:14px; background:rgba(255,255,255,0.08); padding:6px 14px; border-radius:20px; font-size:0.9rem; }.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; }.card{ background:var(--card); border-radius:12px; padding:18px; border:1px solid #2a2a3e; transition:transform .2s; }.card:hover{ transform:translateY(-4px); border-color:var(--accent); }.card h4{ margin:0 0 8px; color:#fff; font-size:1.1rem; }.card .artist{ color:var(--accent); font-size:0.9rem; margin-bottom:6px; }.card p{ font-size:0.95rem; color:var(--muted); margin:0 0 10px; }.news-it
