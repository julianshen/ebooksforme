<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報架 - 日職每日報</title>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 2rem;
        }
        .issues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .issue-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .issue-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        .issue-date {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }
        .issue-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: #1a1a2e;
            margin-bottom: 1rem;
        }
        .issue-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #e94560;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            transition: background 0.2s;
        }
        .issue-link:hover {
            background: #ff6b6b;
        }
        .back-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: #1a1a2e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }
        .info {
            background: #fff3e0;
            border-left: 4px solid #f4a261;
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 報架</h1>
        <p class="subtitle">日職每日報 · JPOP流行報 · 僅留存最近兩週版本</p>
        
        <div class="info">
            <strong>自動更新說明：</strong>日職每日報每日中午12:00自動生成，JPOP流行報每週日自動生成，自動清除超過14天的舊期數。
            <br>最後更新：2026-06-07 13:13:26
        </div>
        
        <div class="issues-grid">
            <div class="issue-card">
                <div class="issue-date">2026年06月07日 星期日</div>
                <div class="issue-title">🎵 JPOP流行報 創刊號</div>
                <a href="jpop/2026-06-07/" class="issue-link">閱讀本期 →</a>
            </div>
            <div class="issue-card">
                <div class="issue-date">2026年06月07日 星期日</div>
                <div class="issue-title">⚾ 日職每日報</div>
                <a href="newspaper/2026-06-07/" class="issue-link">閱讀本期 →</a>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 2rem;">
            <a href="/ebooksforme/" class="back-link">← 返回圖書館</a>
        </div>
    </div>
</body>
</html>
