<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212d45"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#b62324"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#bb8009"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="280" fill="url(#bg4)" rx="12"/>
  <rect x="20" y="20" width="560" height="240" fill="url(#box4)" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="300" y="52" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" filter="url(#glow4)">Session Storage</text>
  <rect x="50" y="80" width="150" height="130" fill="url(#hot)" stroke="#ff7b72" stroke-width="1.5" rx="8" filter="url(#glow4)"/>
  <text x="125" y="115" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Hot</text>
  <text x="125" y="140" text-anchor="middle" fill="#ffdcd7" font-family="system-ui, sans-serif" font-size="12">Redis</text>
  <text x="125" y="165" text-anchor="middle" fill="#ffdcd7" font-family="system-ui, sans-serif" font-size="11">活躍 Session</text>
  <text x="125" y="185" text-anchor="middle" fill="#ff7b72" font-family="system-ui, sans-serif" font-size="11">&lt; 1 hour</text>
  <rect x="225" y="80" width="150" height="130" fill="url(#warm)" stroke="#e3b341" stroke-width="1.5" rx="8" filter="url(#glow4)"/>
  <text x="300" y="115" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Warm</text>
  <text x="300" y="140" text-anchor="middle" fill="#ffe9a3" font-family="system-ui, sans-serif" font-size="12">NATS KV</text>
  <text x="300" y="165" text-anchor="middle" fill="#ffe9a3" font-family="system-ui, sans-serif" font-size="11">近期 Session</text>
  <text x="300" y="185" text-anchor="middle" fill="#e3b341" font-family="system-ui, sans-serif" font-size="11">&lt; 24 hours</text>
  <rect x="400" y="80" width="150" height="130" fill="url(#cold)" stroke="#79c0ff" stroke-width="1.5" rx="8" filter="url(#glow4)"/>
  <text x="475" y="115" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Cold</text>
  <text x="475" y="140" text-anchor="middle" fill="#cae8ff" font-family="system-ui, sans-serif" font-size="12">S3</text>
  <text x="475" y="165" text-anchor="middle" fill="#cae8ff" font-family="system-ui, sans-serif" font-size="11">歷史 Session</text>
  <text x="475" y="185" text-anchor="middle" fill="#79c0ff" font-family="system-ui, sans-serif" font-size="11">&gt; 24 hours</text>
  <line x1="200" y1="145" x2="225" y2="145" stroke="#8b949e" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="375" y1="145" x2="400" y2="145" stroke="#8b949e" stroke-width="2" stroke-dasharray="5,3"/>
</svg>