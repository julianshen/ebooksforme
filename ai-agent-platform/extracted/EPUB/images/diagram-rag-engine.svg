<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212d45"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="sub2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4068"/>
      <stop offset="100%" stop-color="#15325a"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="320" fill="url(#bg2)" rx="12"/>
  <rect x="20" y="20" width="560" height="280" fill="url(#box2)" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="300" y="52" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" filter="url(#glow2)">RAG Engine</text>
  <rect x="60" y="80" width="140" height="100" fill="url(#sub2)" stroke="#58a6ff" stroke-width="1.5" rx="8" filter="url(#glow2)"/>
  <text x="130" y="110" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Document</text>
  <text x="130" y="130" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Loader</text>
  <text x="130" y="155" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10">PDF / Markdown</text>
  <rect x="230" y="80" width="140" height="100" fill="url(#sub2)" stroke="#a371f7" stroke-width="1.5" rx="8" filter="url(#glow2)"/>
  <text x="300" y="110" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Embedding</text>
  <text x="300" y="130" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Model</text>
  <text x="300" y="155" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10">768-dim vectors</text>
  <rect x="400" y="80" width="140" height="100" fill="url(#sub2)" stroke="#3fb950" stroke-width="1.5" rx="8" filter="url(#glow2)"/>
  <text x="470" y="115" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Vector Store</text>
  <text x="470" y="140" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10">pgvector</text>
  <text x="470" y="155" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10">儲存 / 檢索</text>
  <line x1="200" y1="130" x2="230" y2="130" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="130" x2="400" y2="130" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker></defs>
  <rect x="60" y="210" width="480" height="70" fill="#21262d" stroke="#30363d" stroke-width="1" rx="8"/>
  <text x="300" y="235" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Retrieval Flow</text>
  <text x="300" y="260" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Query → Embedding → Similarity Search → Context → LLM</text>
</svg>