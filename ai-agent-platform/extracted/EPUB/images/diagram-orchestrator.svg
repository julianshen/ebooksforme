<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212d45"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="subBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4068"/>
      <stop offset="100%" stop-color="#15325a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="320" fill="url(#bg)" rx="12"/>
  <rect x="20" y="20" width="560" height="280" fill="url(#boxGrad)" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="300" y="52" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" filter="url(#glow)">Orchestrator Agent</text>
  <rect x="60" y="80" width="140" height="90" fill="url(#subBox)" stroke="#58a6ff" stroke-width="1.5" rx="8" filter="url(#glow)"/>
  <text x="130" y="115" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Planner</text>
  <text x="130" y="140" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">拆解任務</text>
  <rect x="230" y="80" width="140" height="90" fill="url(#subBox)" stroke="#3fb950" stroke-width="1.5" rx="8" filter="url(#glow)"/>
  <text x="300" y="115" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Router</text>
  <text x="300" y="140" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">選擇 Agent</text>
  <rect x="400" y="80" width="140" height="90" fill="url(#subBox)" stroke="#d29922" stroke-width="1.5" rx="8" filter="url(#glow)"/>
  <text x="470" y="115" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Monitor</text>
  <text x="470" y="140" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">監控 / 重試</text>
  <line x1="130" y1="170" x2="130" y2="210" stroke="#8b949e" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="300" y1="170" x2="300" y2="210" stroke="#8b949e" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="470" y1="170" x2="470" y2="210" stroke="#8b949e" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="130,205 125,195 135,195" fill="#8b949e"/>
  <polygon points="300,205 295,195 305,195" fill="#8b949e"/>
  <polygon points="470,205 465,195 475,195" fill="#8b949e"/>
  <text x="130" y="235" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">拆解任務</text>
  <text x="300" y="235" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">選擇 Agent</text>
  <text x="470" y="235" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">監控 / 重試</text>
  <rect x="180" y="260" width="240" height="35" fill="#21262d" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="300" y="283" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">NATS Message Bus</text>
</svg>