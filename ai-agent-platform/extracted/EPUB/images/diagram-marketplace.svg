<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="boxm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212d45"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4068"/>
      <stop offset="100%" stop-color="#15325a"/>
    </linearGradient>
    <filter id="glm">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="320" fill="url(#bgm)" rx="12"/>
  <rect x="20" y="20" width="560" height="280" fill="url(#boxm)" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="300" y="52" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" filter="url(#glm)">Agent Marketplace</text>
  <rect x="50" y="80" width="150" height="80" fill="url(#card)" stroke="#58a6ff" stroke-width="1.5" rx="8" filter="url(#glm)"/>
  <text x="125" y="108" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">程式碼審查 Agent</text>
  <text x="125" y="130" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">$0.01 / 次</text>
  <text x="125" y="148" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="10">Python / Go / TS</text>
  <rect x="225" y="80" width="150" height="80" fill="url(#card)" stroke="#3fb950" stroke-width="1.5" rx="8" filter="url(#glm)"/>
  <text x="300" y="108" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">資料分析 Agent</text>
  <text x="300" y="130" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">$0.05 / 次</text>
  <text x="300" y="148" text-anchor="middle" fill="#3fb950" font-family="system-ui, sans-serif" font-size="10">SQL / Pandas / Viz</text>
  <rect x="400" y="80" width="150" height="80" fill="url(#card)" stroke="#d29922" stroke-width="1.5" rx="8" filter="url(#glm)"/>
  <text x="475" y="108" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">安全掃描 Agent</text>
  <text x="475" y="130" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">$0.02 / 次</text>
  <text x="475" y="148" text-anchor="middle" fill="#d29922" font-family="system-ui, sans-serif" font-size="10">SAST / DAST / SCA</text>
  <rect x="50" y="180" width="150" height="80" fill="url(#card)" stroke="#a371f7" stroke-width="1.5" rx="8" filter="url(#glm)"/>
  <text x="125" y="208" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">文件生成 Agent</text>
  <text x="125" y="230" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">$0.005 / 次</text>
  <text x="125" y="248" text-anchor="middle" fill="#a371f7" font-family="system-ui, sans-serif" font-size="10">Markdown / API Doc</text>
  <rect x="225" y="180" width="150" height="80" fill="url(#card)" stroke="#f778ba" stroke-width="1.5" rx="8" filter="url(#glm)"/>
  <text x="300" y="208" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">測試自動化 Agent</text>
  <text x="300" y="230" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">$0.03 / 次</text>
  <text x="300" y="248" text-anchor="middle" fill="#f778ba" font-family="system-ui, sans-serif" font-size="10">Unit / E2E / Load</text>
  <rect x="400" y="180" width="150" height="80" fill="url(#card)" stroke="#79c0ff" stroke-width="1.5" rx="8" filter="url(#glm)"/>
  <text x="475" y="208" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">翻譯本地化 Agent</text>
  <text x="475" y="230" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">$0.01 / 次</text>
  <text x="475" y="248" text-anchor="middle" fill="#79c0ff" font-family="system-ui, sans-serif" font-size="10">i18n / l10n / Review</text>
</svg>